<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Smart Household Reminder Manager</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750');
background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;
color:white;
padding:20px;
}

.dark{
background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),
url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750');
background-size:cover;
background-position:center;
background-attachment:fixed;
}

.login-container{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:30px;
border-radius:20px;
width:350px;
text-align:center;
}

.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
}

.container{
display:none;
max-width:1400px;
margin:auto;
}

.hero{
background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
text-align:center;
margin-bottom:20px;
}

.toolbar{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:15px;
}

.btn{
background:#2563eb;
color:white;
border:none;
padding:12px 18px;
cursor:pointer;
border-radius:8px;
font-weight:600;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin:20px 0;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:20px;
border-radius:15px;
text-align:center;
}

.form-panel{
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:20px;
border-radius:15px;
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:2fr 1fr 1fr 2fr auto;
gap:10px;
}

.form-grid input,.form-grid select{
padding:12px;
border:none;
border-radius:8px;
}

.search{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
background:rgba(255,255,255,.15);
overflow:hidden;
border-radius:10px;
}

th{
background:#2563eb;
padding:12px;
}

td{
padding:10px;
text-align:center;
}

.action{
border:none;
padding:6px 10px;
color:white;
cursor:pointer;
border-radius:5px;
margin:2px;
}

.edit{background:#f59e0b;}
.done{background:#16a34a;}
.delete{background:#dc2626;}

.overdue{background:rgba(220,38,38,.35);}
.today{background:rgba(245,158,11,.35);}
.completed{background:rgba(22,163,74,.35);}

.mobileCards{
display:none;
}

.mobileTask{
background:rgba(255,255,255,.15);
padding:15px;
margin-bottom:10px;
border-radius:12px;
}

@media(max-width:768px){

.form-grid{
grid-template-columns:1fr;
}

table{
display:none;
}

.mobileCards{
display:block;
}
}

</style>
</head>

<body>

<div id="loginPage" class="login-container">

<div class="login-box">

<h2>🔐 Login</h2>

<input type="text" id="username" placeholder="Username">

<input type="password" id="password" placeholder="Password">

<button class="btn" onclick="login()">
Login
</button>

<p id="loginError" style="color:#ffb3b3;margin-top:10px;"></p>

</div>

</div>

<div id="appContent" class="container">

<div class="hero">

<h1>🏠 Smart Household Reminder Manager</h1>

<p>
Manage recurring household tasks and reminders
</p>

<div class="toolbar">

<button class="btn" onclick="toggleTheme()">
🌙 Theme
</button>

<button class="btn" onclick="downloadBackup()">
💾 Export
</button>

<button class="btn" onclick="document.getElementById('restoreFile').click()">
📂 Import
</button>

<button class="btn" onclick="logout()">
🚪 Logout
</button>

<input
type="file"
id="restoreFile"
accept=".json"
style="display:none"
onchange="restoreBackup(event)">

</div>

</div>

<div class="stats">

<div class="card">
<h2 id="totalTasks">0</h2>
<p>Total Tasks</p>
</div>

<div class="card">
<h2 id="todayTasks">0</h2>
<p>Due Today</p>
</div>

<div class="card">
<h2 id="overdueTasks">0</h2>
<p>Overdue</p>
</div>

<div class="card">
<h2 id="completedTasks">0</h2>
<p>Completed</p>
</div>

</div>

<div class="form-panel">

<div class="form-grid">

<input
type="text"
id="work"
placeholder="Work To Be Done">

<input
type="date"
id="duedate">

<select id="frequency">
<option value="0">One Time</option>
<option value="7">Weekly</option>
<option value="15">Half Monthly</option>
<option value="1">Monthly</option>
<option value="3">Quarterly</option>
<option value="6">Half Yearly</option>
<option value="12">Yearly</option>
</select>

<input
type="text"
id="remark"
placeholder="Remarks">

<button
id="saveBtn"
class="btn"
onclick="saveTask()">
➕ Add Task
</button>

</div>

</div>

<input
class="search"
id="search"
placeholder="🔍 Search Tasks..."
onkeyup="render()">

<table>

<thead>
<tr>
<th>Sr No</th>
<th>Work</th>
<th>Due Date</th>
<th>Frequency</th>
<th>Remarks</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="taskTable"></tbody>

</table>

<div class="mobileCards" id="mobileCards"></div>

</div>

<script>

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(user==="admin" && pass==="12345"){

sessionStorage.setItem("loggedIn","true");

document.getElementById("loginPage")
.style.display="none";

document.getElementById("appContent")
.style.display="block";

render();

}else{

document.getElementById("loginError")
.innerText="Invalid Username or Password";
}
}

window.onload=function(){

if(sessionStorage.getItem("loggedIn")==="true"){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("appContent")
.style.display="block";

render();
}
}

function logout(){

sessionStorage.removeItem("loggedIn");
location.reload();

}

let tasks =
JSON.parse(localStorage.getItem("tasks")) || [];

let editIndex=-1;

function saveData(){
localStorage.setItem("tasks",
JSON.stringify(tasks));
}

function saveTask(){

if(!work.value || !duedate.value){
alert("Enter Work & Due Date");
return;
}

if(editIndex==-1){

tasks.push({
work:work.value,
duedate:duedate.value,
frequency:frequency.value,
remark:remark.value,
completed:false
});

}else{

tasks[editIndex].work=work.value;
tasks[editIndex].duedate=duedate.value;
tasks[editIndex].frequency=frequency.value;
tasks[editIndex].remark=remark.value;

editIndex=-1;
saveBtn.innerHTML="➕ Add Task";
}

saveData();
clearForm();
render();
}

function clearForm(){

work.value="";
duedate.value="";
frequency.value="0";
remark.value="";

}

function editTask(i){

let t=tasks[i];

work.value=t.work;
duedate.value=t.duedate;
frequency.value=t.frequency;
remark.value=t.remark;

editIndex=i;

saveBtn.innerHTML="💾 Save";

}

function deleteTask(i){

if(confirm("Delete task?")){

tasks.splice(i,1);

saveData();
render();

}
}

function completeTask(i){

let t=tasks[i];

if(t.frequency=="0"){

t.completed=true;

}else{

let d=new Date(t.duedate);

if(t.frequency=="7")
d.setDate(d.getDate()+7);

else if(t.frequency=="15")
d.setDate(d.getDate()+15);

else
d.setMonth(d.getMonth()+parseInt(t.frequency));

t.duedate=d.toISOString().split('T')[0];
}

saveData();
render();
}

function getFrequency(f){

const map={
0:"One Time",
7:"Weekly",
15:"Half Monthly",
1:"Monthly",
3:"Quarterly",
6:"Half Yearly",
12:"Yearly"
};

return map[f];
}

function render(){

let body=document.getElementById("taskTable");
let cards=document.getElementById("mobileCards");

body.innerHTML="";
cards.innerHTML="";

let today=new Date()
.toISOString()
.split("T")[0];

let total=0;
let dueToday=0;
let overdue=0;
let completed=0;

tasks.forEach((t,index)=>{

let cls="";
let status="Pending";

if(t.completed){

status="Completed";
cls="completed";
completed++;

}
else if(t.duedate<today){

status="Overdue";
cls="overdue";
overdue++;

}
else if(t.duedate===today){

status="Due Today";
cls="today";
dueToday++;

}

total++;

body.innerHTML += `
<tr class="${cls}">
<td>${index+1}</td>
<td>${t.work}</td>
<td>${t.duedate}</td>
<td>${getFrequency(t.frequency)}</td>
<td>${t.remark}</td>
<td>${status}</td>
<td>
<button class="action edit" onclick="editTask(${index})">Edit</button>
<button class="action done" onclick="completeTask(${index})">Done</button>
<button class="action delete" onclick="deleteTask(${index})">Del</button>
</td>
</tr>`;

cards.innerHTML += `
<div class="mobileTask ${cls}">
<h3>${t.work}</h3>
<p>Due: ${t.duedate}</p>
<p>Frequency: ${getFrequency(t.frequency)}</p>
<p>Status: ${status}</p>
</div>`;
});

totalTasks.innerText=total;
todayTasks.innerText=dueToday;
overdueTasks.innerText=overdue;
completedTasks.innerText=completed;
}

function downloadBackup(){

let blob=new Blob(
[JSON.stringify(tasks,null,2)],
{type:"application/json"}
);

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="HouseholdBackup.json";
a.click();

}

function restoreBackup(event){

let file=event.target.files[0];

if(!file) return;

let reader=new FileReader();

reader.onload=function(e){

tasks=JSON.parse(e.target.result);

saveData();
render();

};

reader.readAsText(file);

}

function toggleTheme(){

document.body.classList.toggle("dark");

}

</script>

</body>
</html>
